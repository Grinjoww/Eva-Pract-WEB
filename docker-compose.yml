Rservices:
  postgres:
    image: postgres:16-alpine
    container_name: mercado-quevedo-postgres
    environment:
      POSTGRES_DB: mercado_quevedo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mercado-quevedo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mercado-quevedo-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Relaxed binding de Spring Boot: SPRING_DATASOURCE_URL -> spring.datasource.url, etc.
      # Dentro de la red de Docker, "postgres" y "redis" son los nombres de host
      # de los servicios de arriba (no "localhost").
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mercado_quevedo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?La variable JWT_SECRET es obligatoria. Copia .env.example a .env y define un valor.}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
